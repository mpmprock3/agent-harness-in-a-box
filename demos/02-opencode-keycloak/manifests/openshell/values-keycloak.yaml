# OpenShell Helm values for Keycloak OIDC on OpenShift.
#
# The OIDC issuer must use the EXTERNAL Keycloak route hostname so that both
# the gateway (in-cluster) and the CLI (your workstation) can reach it.
# Update the issuer URL below to match your cluster's Keycloak route.

# OpenShift-specific overrides
pkiInitJob:
  enabled: false

podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

server:
  disableTls: false
  tls:
    certSecretName: openshell-tls
    clientCaSecretName: openshell-client-ca
    clientTlsSecretName: openshell-client-ca

  oidc:
    issuer: "https://keycloak-openshell-keycloak.apps.your-cluster.example.com/realms/openshell"
    audience: "openshell-cli"
    jwksTtl: 60
    rolesClaim: "realm_access.roles"
    adminRole: "openshell-admin"
    userRole: "openshell-user"
